schema_version = 1
participant = "openai"

[inference]
mode = "offline"
base_url = "http://127.0.0.1:8080/v1"
model = "replace-with-your-local-model-id"
# Optional vLLM extension; lower values run first. Nonzero values require
# vLLM --scheduling-policy priority. Leave unset for other servers.
# vllm_priority = -1

[generation]
temperature = 0
max_tokens = 16384

[budgets]
max_turns = 24
wall_seconds = 300
