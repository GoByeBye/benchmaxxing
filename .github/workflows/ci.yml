name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
  browser-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: npm ci
        working-directory: web
      - run: uv run --locked python scripts/export_openapi.py
      - run: npm run generate:api
        working-directory: web
      - run: git diff --exit-code -- web/openapi.json web/src/api-types.ts
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:firefox
        working-directory: web
      - run: uv run --locked benchmaxxing prepare
      - run: uv run --locked pytest tests/integration -q
        env:
          BENCHMAXXING_DOCKER_TESTS: '1'
          BENCHMAXXING_TEST_DATA_DIR: ${{ github.workspace }}/.benchmaxxing
      - name: Start local service
        run: |
          uv run --locked benchmaxxing serve > server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8123/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - run: npm run test:integration
        working-directory: web
        env:
          BENCHMAXXING_E2E_URL: http://127.0.0.1:8123
      - run: uv run --locked benchmaxxing run --config examples/scripted.toml
      - run: uv build --no-sources
      - run: uv run --locked python scripts/check_dist.py
