[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "benchmaxxing"
version = "0.1.0"
description = "Reproducible offline benchmarks for models and agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "typer>=0.15,<1", "uvicorn>=0.34,<1", "filelock>=3.17,<5",
]

[project.scripts]
benchmaxxing = "benchmaxxing.cli:app"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo", "**/.env", "**/.env.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmaxxing"]
artifacts = ["src/benchmaxxing/static/**"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/benchmaxxing", "tests", "scripts", "docs", "examples", "packs", ".github",
  "web/src", "web/tests", "web/public", "web/index.html", "web/.gitignore",
  "web/package.json", "web/package-lock.json", "web/openapi.json", "web/tsconfig.json",
  "web/vite.config.ts", "web/playwright.config.ts", "web/playwright.integration.config.ts",
  "README.md", "CONTRIBUTING.md", "LICENSE", "AGENTS.md", "pyproject.toml", "uv.lock",
  ".gitignore", ".gitattributes", ".dockerignore", ".python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires explicitly prepared Docker assets", "integration: integration checks"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/benchmaxxing"]
exclude = ["src/benchmaxxing/reference/"]
